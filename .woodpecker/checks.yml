# Repris d'echecs-kid (.woodpecker/checks.yml). Ce workflow va de l'installation au build ; la suite de la
# chaîne (Playwright, SCA/SAST avec SBOM CycloneDX, artefacts) est dans .woodpecker/e2e.yml, qui en dépend.
# Node : l'image officielle node:26 via le proxy Harbor. L'etape build affiche l'empreinte de dist/ :
# le script de publication reconstruit le meme commit et refuse de publier un arbre different.
labels:
    host: tank01

when:
    - event: push
      branch: main
    - event: [pull_request, manual]

steps:
    - name: npm ci
      image: &node harbor.pingfr.duckdns.org/dockerhub/library/node:26
      pull: true
      commands:
          - node --version
          - npm ci
    - name: lint
      image: *node
      commands:
          - npm run lint
    - name: typecheck
      image: *node
      commands:
          - npm run typecheck
    - name: assets
      image: *node
      commands:
          - npm run assets -- check
    - name: test
      image: *node
      commands:
          - |
              # oxipng (tests/assets-png-optimises.test.ts) : binaire musl de la version de l'atelier, empreinte vérifiée.
              # Absent de l'image Node (ni Debian trixie) : sans lui le test serait sauté au lieu de tourner.
              V=10.2.1
              curl -sSfL -o /tmp/oxipng.tgz "https://github.com/oxipng/oxipng/releases/download/v$$V/oxipng-$$V-x86_64-unknown-linux-musl.tar.gz"
              echo "1813750ef592c5350ca79c88f98b2c0876d05c826dc7156245256d4255c1ad17  /tmp/oxipng.tgz" | sha256sum -c -
              tar xzf /tmp/oxipng.tgz -C /usr/local/bin --strip-components=1 "oxipng-$$V-x86_64-unknown-linux-musl/oxipng"
              oxipng --version
          - npm test
    - name: build
      image: *node
      commands:
          - npm run build
          - |
              empreinte_dist() {
                (cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-64)
              }
              avant=$(empreinte_dist)
              npm run build
              apres=$(empreinte_dist)
              test "$$avant" = "$$apres"
              sha256sum dist/index.html
              echo "empreinte dist $$apres"
    - name: check:precache
      image: *node
      commands:
          - npm run check:static
          - npm run check:precache
